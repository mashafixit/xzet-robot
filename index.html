<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XZED 0.4</title><style>body{margin:0;background:#0b1020;color:white;font-family:system-ui;text-align:center;display:flex;align-items:center;justify-content:center;min-height:100dvh}.wrap{width:min(95%,520px)}.eyes{display:flex;justify-content:center;gap:35px;margin:30px}.eye{background:#5cd5ff;width:95px;height:120px;border-radius:50%;position:relative;animation:blink 6s infinite}.eye:after{content:'';position:absolute;top:40px;left:43px;width:23px;height:34px;background:#081020;border-radius:50%}@keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.07)}}button{padding:17px 25px;border:0;border-radius:40px;background:#5cd5ff;color:#07111c;font-weight:700;font-size:18px}button:disabled{opacity:.5}#status{min-height:3em;color:#b9d5e5}#heard{color:#aab4c9}small{color:#99a7bb}</style></head><body><main class="wrap"><h1>XZED</h1><div class="eyes"><div class="eye"></div><div class="eye"></div></div><p id="status">Hey! Tippe auf „Stimme testen“ und lerne mich kennen.</p><button id="talk">🎙️ Mit XZED sprechen</button><p><button id="voice" type="button">🔊 Stimme testen</button></p><input id="question" placeholder="Frage eintippen" style="padding:14px;border-radius:12px;width:70%;max-width:280px"><button id="send" type="button">Senden</button><p id="heard"></p><small>Prototyp: keine generative KI. Mikrofon wird nur per Knopfdruck aktiviert.</small></main><script>
const status=document.getElementById('status'), heard=document.getElementById('heard'),btn=document.getElementById('talk');let busy=false;
function answer(t){const s=t.toLowerCase();if(/hallo|guten tag|hey|servus/.test(s))return 'Hey, ich bin Kset, dein digitaler Helfer mit ziemlich viel Wissen und absolut null Kaffeebedarf. Was kann ich für dich tun?';if(/verkaufen|ankauf|inzahlung|altes handy/.test(s))return 'Du möchtest ein Handy verkaufen? Sehr gerne. Meine menschlichen Kollegen prüfen Zustand, Modell und Speicher und machen dir ein persönliches Angebot.';if(/datenrettung|daten verloren|bilder weg|fotos weg/.test(s))return 'Bei Datenverlust helfen meine Kollegen gerne weiter. Bitte setze das betroffene Gerät möglichst nicht weiter ein, bis wir es geprüft haben.';if(/reparatur|display|akku|kaputt/.test(s))return 'Bei Reparaturen kommt es auf das Modell und den Fehler an. Meine Kollegen schauen sich dein Gerät gerne an und erklären dir die Möglichkeiten.';if(/öffnungszeit|wann.*offen|wann.*geöffnet/.test(s))return 'Wir sind montags bis freitags von zwölf bis neunzehn Uhr und samstags von zwölf bis achtzehn Uhr für dich da. Feiertage können abweichen.';if(/wer bist du|dein name|wie heißt du/.test(s))return 'Ich bin Kset, dein digitaler Helfer. Ich bin noch in der Testphase und brauche nicht mal Kaffee!';return 'Das ist eine gute Frage. Ich lerne noch und möchte dir nichts Falsches erzählen. Meine Kollegen helfen dir persönlich weiter.'}
function speak(t){status.textContent=t;if(!('speechSynthesis'in window)){busy=false;btn.disabled=false;return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.95;u.onend=u.onerror=()=>{busy=false;btn.disabled=false};speechSynthesis.speak(u)}
document.getElementById('voice').onclick=()=>speak('Hey, ich bin Kset, dein digitaler Helfer mit ziemlich viel Wissen und absolut null Kaffeebedarf. Was kann ich für dich tun?');document.getElementById('send').onclick=()=>{const t=document.getElementById('question').value.trim();if(t){heard.textContent='Du: '+t;speak(answer(t))}};if(location.protocol==='file:'){status.textContent='Lokale Datei erkannt. Texteingabe und Stimme testen; Mikrofon benötigt eventuell HTTPS.'}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){btn.disabled=true;status.textContent='Spracherkennung nicht verfügbar. Bitte Texteingabe testen und Chrome über HTTPS verwenden.'}else{btn.onclick=()=>{if(busy)return;busy=true;btn.disabled=true;status.textContent='Ich höre zu …';heard.textContent='';const r=new SR();r.lang='de-DE';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const t=e.results[0][0].transcript;heard.textContent='Du: '+t;speak(answer(t))};r.onerror=e=>{status.textContent='Spracherkennung: '+e.error;busy=false;btn.disabled=false};r.onend=()=>{if(!heard.textContent){busy=false;btn.disabled=false;status.textContent='Nichts erkannt. Bitte erneut versuchen.'}};try{r.start()}catch(e){status.textContent=e.message;busy=false;btn.disabled=false}}}
</script></body></html>
